<meta name=viewport content="width=device-width,initial-scale=1">
<body style="background:#000;color:#fff;margin:0;padding:0 4vw;box-sizing:border-box;height:100vh;height:100dvh;overflow:hidden;display:grid;place-items:center;text-align:center;font:clamp(18px,5vw,48px)/1.4 sans-serif;overflow-wrap:anywhere">
<div>PiCapes Patcher Server (<span id=c>...</span>)<br><a href=https://picapes.syanic.org style="color:inherit;text-decoration:none">https://picapes.syanic.org</a></div>
<script>
for (let i = 0; i < 5; i++) {
  try {
    const r = await fetch("https://api.github.com/repos/picapes/patcher-server-vercel/commits/main");
    if (!r.ok) throw 0;
    c.textContent = (await r.json()).sha.slice(0, 7);
    break;
  } catch {
    if (i === 4) c.textContent = "unknown";
  }
}
</script>
